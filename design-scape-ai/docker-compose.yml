services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: designscape
      POSTGRES_USER: designscape
      POSTGRES_PASSWORD: change-this-local-password
    ports: ["5432:5432"]
    volumes: ["designscape_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designscape -d designscape"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://designscape:change-this-local-password@db:5432/designscape
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  designscape_db:
