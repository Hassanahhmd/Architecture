services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: designscape
      POSTGRES_USER: designscape
      POSTGRES_PASSWORD: change-this-local-password
    ports: ["5432:5432"]
    volumes: ["designscape_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designscape -d designscape"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./backend:/app"]
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  designscape_db:
