name: Design Scape AI CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "design-scape-ai/**"
      - ".github/workflows/design-scape-ai.yml"
  push:
    branches: [main, "feature/design-scape-ai"]
    paths:
      - "design-scape-ai/**"
      - ".github/workflows/design-scape-ai.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-scape-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-scape-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Verify OpenAI API key
        if: github.event_name != 'pull_request'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("OPENAI_API_KEY", "")
          if not key:
              print("OPENAI_API_KEY repository secret is missing.")
              sys.exit(1)

          request = urllib.request.Request(
              "https://api.openai.com/v1/models",
              headers={"Authorization": f"Bearer {key}"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status == 200:
                      print("OpenAI API key authentication successful.")
                  else:
                      print(f"OpenAI API returned HTTP {response.status}.")
                      sys.exit(1)
          except urllib.error.HTTPError as error:
              print(f"OpenAI authentication check failed (HTTP {error.code}).")
              sys.exit(1)
          except Exception as error:
              print(f"OpenAI connectivity check failed: {type(error).__name__}.")
              sys.exit(1)
          PY

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate integration source syntax
        run: |
          ruby -c design-scape-ai/integrations/sketchup/design_scape_ai.rb
          ruby -c design-scape-ai/integrations/sketchup/design_scape_ai/main.rb
          python -m py_compile design-scape-ai/integrations/blender/design_scape_import.py
          python -m py_compile design-scape-ai/integrations/3ds-max/design_scape_import.py
      - name: Package SketchUp RBZ
        run: |
          mkdir -p dist
          cd design-scape-ai/integrations/sketchup
          zip -r ../../../dist/design-scape-ai-sketchup.rbz design_scape_ai.rb design_scape_ai
      - uses: actions/upload-artifact@v4
        with:
          name: design-scape-ai-sketchup-extension
          path: dist/design-scape-ai-sketchup.rbz
