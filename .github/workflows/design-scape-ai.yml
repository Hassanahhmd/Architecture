name: Design Scape AI CI

on:
  pull_request:
    paths:
      - "design-scape-ai/**"
      - ".github/workflows/design-scape-ai.yml"
  push:
    branches: [main, "feature/design-scape-ai"]
    paths:
      - "design-scape-ai/**"
      - ".github/workflows/design-scape-ai.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-scape-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-scape-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
